<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SICAPER</title>
<meta name="description" content="SICAPER：SI 超级智能 × Caper 探索。一个探索超级智能的实验场。">
<meta name="theme-color" content="#05080a">
<link rel="preload" href="fonts/zendots.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Zen Dots";src:url(fonts/zendots.woff2) format("woff2");font-display:swap}
:root{--bg:#05080a;--fg:#c8f7ff;--dim:#4f7a83;--acc:#2ef2ff;--line:rgba(46,242,255,.14);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"PingFang SC","Microsoft YaHei",monospace;
  --display:"Zen Dots","PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--mono);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:40px 40px}
/* 扫描线 */
body:after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px)}
.w{max-width:880px;margin:0 auto;padding:72px 16px}
.boot{color:var(--dim);font-size:13px;line-height:1.9}
.boot b{color:var(--acc);font-weight:400}
h1{font-family:var(--display);font-weight:400;font-size:clamp(38px,9vw,76px);letter-spacing:.06em;margin:18px 0 6px;color:#fff;text-shadow:0 0 18px rgba(46,242,255,.6)}
/* 闪烁光标 */
h1 i{display:inline-block;width:.5em;height:.9em;background:var(--acc);vertical-align:-.08em;margin-left:.1em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.tag{color:var(--dim);font-size:14px;margin-bottom:48px}
.card{position:relative;display:block;padding:24px 26px;border:1px solid var(--line);background:rgba(5,20,24,.7);color:inherit;text-decoration:none;transition:border-color .2s,box-shadow .2s}
/* 四角括号 */
.card:before,.card:after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--acc)}
.card:before{top:-2px;left:-2px;border-right:0;border-bottom:0}
.card:after{bottom:-2px;right:-2px;border-left:0;border-top:0}
.card:hover,.card:focus-visible{border-color:var(--acc);box-shadow:0 0 24px rgba(46,242,255,.25),inset 0 0 24px rgba(46,242,255,.08);outline:none}
.id{font-family:var(--display);color:var(--acc);font-size:11px;letter-spacing:.2em}
.t{font-size:22px;color:#fff;margin:8px 0}
.d{color:var(--dim);font-size:13px;line-height:1.7}
.go{position:absolute;right:24px;top:24px;font-family:var(--display);font-size:13px;color:var(--acc)}
.slot{margin-top:16px;padding:18px 26px;border:1px dashed var(--line);color:var(--dim);font-family:var(--display);font-size:11px;letter-spacing:.2em}
footer{margin-top:64px;color:var(--dim);font-family:var(--display);font-size:10px;letter-spacing:.2em}
@media (max-width:640px){
  .w{padding-top:48px}
  .go{position:static;display:block;margin-top:14px}
}
@media (prefers-reduced-motion:reduce){h1 i{animation:none}}
</style>
</head>
<body>
<div class="w">
  <div class="boot">&gt; connecting <b>sicaper.net</b> …… ok<br>&gt; modules loaded: <b>1</b></div>
  <h1 aria-label="SICAPER">SICAPER<i aria-hidden="true"></i></h1>
  <div class="tag">// SI 超级智能 × Caper 探索 · 一个探索超级智能的实验场</div>
  <a class="card" href="/ndx100/">
    <div class="id">MODULE_01 · NDX100</div>
    <div class="t">纳指100 成分股市盈率</div>
    <div class="d">QQQ 前 33 大持仓的滚动 / 前瞻市盈率对比 · 每月更新</div>
    <span class="go">[ ENTER → ]</span>
  </a>
  <div class="slot">MODULE_02 · 待上线_</div>
  <footer>© 2026 SICAPER.NET</footer>
</div>
</body>
</html>
