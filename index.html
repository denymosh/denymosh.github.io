<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SICAPER</title>
<meta name="description" content="SICAPER：SI 超级智能 × Caper 探索。一个探索超级智能的实验场。">
<meta name="theme-color" content="#04070a">
<link rel="preload" href="/fonts/audiowide.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
</head>
<body class="intro">
<svg class="eye-ring" viewBox="0 0 100 100" aria-hidden="true"><g class="spin"><circle cx="50" cy="50" r="46" stroke-width=".15" stroke-dasharray="2 1.2"/><circle cx="50" cy="50" r="38" stroke-width=".1"/></g></svg>
<div class="eye" aria-hidden="true"><i class="core"></i></div>
<div class="w">
  <div class="rise"><h1 aria-label="SICAPER"><span class="si">SI</span>CAPER</h1><div class="horizon"></div><div class="flare"></div></div>
  <nav class="later">
    <span><b>[ SI ]</b>SUPER INTELLIGENCE</span>
    <a class="go-link" href="/ndx100/"><b>[ 01 ]</b>NDX100</a>
    <span><b>[ CAPER ]</b>EXPLORATION</span>
  </nav>
  <main class="hero later">
    <div class="lead">
      <h2>SUPER INTELLIGENCE,<br>ENDLESS CAPERS.</h2>
      <p><em>SI</em> 是超级智能，<em>Caper</em> 是探索。<br>这里是一个探索超级智能的实验场。</p>
    </div>
    <div class="eye-slot" aria-hidden="true"></div>
    <div class="cards">
      <a class="card go-link" href="/ndx100/">
        <div class="k">MODULE 01 · NDX100</div>
        <div class="t">纳指100 成分股市盈率</div>
        <div class="d">QQQ 前 33 大持仓 · 滚动 / 前瞻市盈率 · 每月更新</div>
        <span class="ar" aria-hidden="true">↗</span>
      </a>
      <div class="card soon"><div class="k">MODULE 02 · AWAITING SIGNAL<span class="blink">_</span></div></div>
    </div>
  </main>
  <footer class="later"><span class="ok">SI-01 · ALL SYSTEMS NOMINAL</span><span>SICAPER.NET · © 2026</span></footer>
</div>
<div class="gate" aria-hidden="true"><svg viewBox="0 0 100 100"><g style="animation-delay:0.00s"><circle cx="50" cy="50" r="40"/></g><g style="animation-delay:0.05s"><circle cx="50" cy="50" r="40"/></g><g style="animation-delay:0.10s"><circle cx="50" cy="50" r="40"/></g><g style="animation-delay:0.15s"><circle cx="50" cy="50" r="40"/></g><g style="animation-delay:0.20s"><circle cx="50" cy="50" r="40"/></g><g style="animation-delay:0.25s"><circle cx="50" cy="50" r="40"/></g><g style="animation-delay:0.30s"><circle cx="50" cy="50" r="40"/></g><g style="animation-delay:0.35s"><circle cx="50" cy="50" r="40"/></g><g style="animation-delay:0.40s"><circle cx="50" cy="50" r="40"/></g><g style="animation-delay:0.45s"><circle cx="50" cy="50" r="40"/></g><g style="animation-delay:0.50s"><circle cx="50" cy="50" r="40"/></g><g style="animation-delay:0.55s"><circle cx="50" cy="50" r="40"/></g></svg></div>
<div class="whiteout" aria-hidden="true"></div>
<script>
(()=>{
  const eye=document.querySelector('.eye'),ring=document.querySelector('.eye-ring'),slot=document.querySelector('.eye-slot');
  // 手机上把 HAL 之眼摆到标语和卡片之间的空位
  function place(){
    const r=slot.getBoundingClientRect(),y=r.height?r.top+scrollY+r.height/2+'px':'';
    eye.style.top=ring.style.top=y;
  }
  place();addEventListener('resize',place);addEventListener('load',place);document.fonts&&document.fonts.ready.then(place);

  const links=document.querySelectorAll('.go-link');
  links.forEach(a=>{
    a.addEventListener('mouseenter',()=>document.body.classList.add('watch'));
    a.addEventListener('mouseleave',()=>document.body.classList.remove('watch'));
    a.addEventListener('click',e=>{
      if(e.metaKey||e.ctrlKey||e.shiftKey||e.button||matchMedia('(prefers-reduced-motion:reduce)').matches) return;
      e.preventDefault();
      // 光圈以 HAL 之眼为圆心
      const r=eye.getBoundingClientRect(),g=document.querySelector('.gate');
      g.style.setProperty('--cx',r.left+r.width/2+'px');g.style.setProperty('--cy',r.top+r.height/2+'px');
      document.body.classList.add('go');
      setTimeout(()=>{location.href=a.href},1250);
    });
  });
  // 从纳指页返回时（浏览器往返缓存）恢复原状
  addEventListener('pageshow',e=>{if(e.persisted)document.body.classList.remove('go','watch')});
})();
</script>
</body>
</html>
